name: Foundation library regression
on:
  push:
    paths:
      - 'reverse-engineering/tiny-glade/reconstruction/shared-foundation/**'
      - '.github/workflows/foundation-libraries.yml'
  pull_request:
    paths:
      - 'reverse-engineering/tiny-glade/reconstruction/shared-foundation/**'
      - '.github/workflows/foundation-libraries.yml'
  workflow_dispatch:
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: reverse-engineering/tiny-glade/reconstruction/shared-foundation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Rust
        run: rustup toolchain install 1.86.0 --profile minimal --component rustfmt --component clippy
      - name: Install Linux window-system headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libx11-dev libxkbcommon-dev libwayland-dev
      - name: Prepare disposable verification workspace
        run: python scripts/prepare_foundation_workspace.py "$RUNNER_TEMP/foundation-libraries"
      - name: Resolve temporary lock and check migrated GUI consumer
        run: cargo +1.86.0 check --manifest-path "$RUNNER_TEMP/foundation-libraries/Cargo.toml" -p tg-iced --all-targets
      - name: Test libraries and isolated filesystem behavior
        run: cargo +1.86.0 test --locked --manifest-path "$RUNNER_TEMP/foundation-libraries/Cargo.toml" -p paths -p lang-lib -p tabloid --all-targets
      - name: Lint libraries
        run: cargo +1.86.0 clippy --locked --manifest-path "$RUNNER_TEMP/foundation-libraries/Cargo.toml" -p paths -p lang-lib -p tabloid --all-targets -- -D warnings
      - name: Check formatting of changed libraries
        run: cargo +1.86.0 fmt --manifest-path "$RUNNER_TEMP/foundation-libraries/Cargo.toml" -p paths -p lang-lib -p tabloid -p tg-iced --check
      - name: Allocation and publication cost probes
        run: |
          cargo +1.86.0 run --locked --manifest-path "$RUNNER_TEMP/foundation-libraries/Cargo.toml" -p lang-lib --example review_missing_cache
          cargo +1.86.0 run --locked --release --manifest-path "$RUNNER_TEMP/foundation-libraries/Cargo.toml" -p tabloid --example review_publication_cost
