[package]
name = "garden-presentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
desktop = ["dep:bevy", "dep:garden-bevy"]

[dependencies]
garden-domain.workspace = true
garden-generation.workspace = true
garden-geometry.workspace = true
garden-application.workspace = true
serde.workspace = true
serde_json.workspace = true
garden-bevy = { workspace = true, optional = true }
bevy = { version = "=0.19.1", optional = true, default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log", "bevy_color", "bevy_image", "bevy_camera", "bevy_light", "bevy_shader", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_gizmos", "bevy_gizmos_render", "bevy_winit", "bevy_window", "bevy_ui", "bevy_ui_render", "bevy_text", "default_font", "png", "tonemapping_luts", "zstd_rust", "x11"] }

[[bin]]
name = "showcase"
path = "src/bin/showcase.rs"
required-features = ["desktop"]
