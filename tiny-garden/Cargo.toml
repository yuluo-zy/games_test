[workspace]
members = ["crates/geometry", "crates/domain", "crates/application", "crates/generation", "crates/bevy-adapter", "crates/presentation"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
garden-geometry = { path = "crates/geometry" }
garden-domain = { path = "crates/domain" }
garden-application = { path = "crates/application" }
garden-generation = { path = "crates/generation" }
garden-bevy = { path = "crates/bevy-adapter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy_app = { version = "=0.19.1", default-features = false, features = ["std"] }
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std", "multi_threaded"] }
bevy_tasks = { version = "=0.19.1", default-features = false, features = ["multi_threaded"] }

[profile.release]
lto = "thin"
codegen-units = 1
