[workspace]
members = ["crates/geometry", "crates/domain", "crates/application", "crates/generation", "crates/bevy-adapter", "crates/presentation"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
garden-geometry = { path = "crates/geometry" }
garden-domain = { path = "crates/domain" }
garden-application = { path = "crates/application" }
garden-generation = { path = "crates/generation" }
garden-bevy = { path = "crates/bevy-adapter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy_app = { version = "=0.19.1", default-features = false, features = ["std"] }
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std", "multi_threaded"] }
bevy_tasks = { version = "=0.19.1", default-features = false, features = ["multi_threaded"] }

[profile.release]
lto = "thin"
codegen-units = 1

# Iteration profile. An unoptimized Bevy is the single largest source of the
# "it takes ages before the picture updates" feeling: shader processing,
# render preparation and pipeline creation all run roughly an order of
# magnitude slower at opt-level 0. Dependencies are therefore optimized even
# in dev builds.
#
# Geometry and kit fitting now dominate edit latency: selectively optimize
# these CPU-heavy crates, keeping the command/UI adapter quick to rebuild.
[profile.dev]
opt-level = 0

# `debug = false` here keeps Bevy's object code out of the link line's debug
# sections, which is what makes linking the desktop binary the slowest step of
# an incremental build. Workspace crates keep full debug info.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev.package.garden-generation]
opt-level = 2

[profile.dev.package.garden-presentation]
opt-level = 1

[profile.dev.package.garden-bevy]
opt-level = 1
