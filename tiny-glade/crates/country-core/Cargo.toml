[package]
readme = "README.md"
name = "country-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Tiny Glade game rendering declarations and recovered domain rules"

[features]
# Count-only owner TLS instrumentation; absent from production builds.
cpu-probe = []
native-physics = ["dep:rapier3d"]
native-audio = ["dep:libfmod"]
# CPU-only placeholder device for downstream crates' tests (see render::test_device).
test-support = []
# Correctness-only owned per-draw constant observations; never CPU measurement.
surface-compare-test = ["test-support"]

[dependencies]
motomoto = { path = "../motomoto" }
bevy_app.workspace = true
bevy_tasks.workspace = true
ahash = "=0.8.11"
petgraph = "=0.8.1"
rhapsody.workspace = true
shader-pipeline.workspace = true
obvhs.workspace = true
# Constrain the reused fork's radix sorter to the original B lock identity.
rdst = { version = "=0.20.14", default-features = false }
tabloid.workspace = true
tg-history.workspace = true
tg-terrain.workspace = true
tg-text = { path = "../tg-text" }
paths.workspace = true
tempfile = "=3.20.0"
crossbeam-channel = "=0.5.6"
fastrand.workspace = true
perchance.workspace = true
rapier3d = { workspace = true, optional = true }
anyhow.workspace = true
asset = { path = "../asset" }
ash.workspace = true
bevy_ecs = { version = "=0.16.0", default-features = false }
bevy_input = { version = "=0.16.0", default-features = false, features = ["std", "serialize"] }
bevy_time = { version = "=0.16.0", default-features = false }
bevy_state = { version = "=0.16.0", default-features = false, features = ["std", "bevy_app"] }
libfmod = { version = "=2.222.6", optional = true }
bitvec = "=1.0.1"
hexasphere = "=12.0.0"
bytemuck = { workspace = true, features = ["min_const_generics"] }
bracket-noise = "=0.8.2"
glam = { workspace = true, features = ["serde", "bytemuck"] }
half.workspace = true
hashbrown = "=0.14.5"
smallvec = "=1.13.2"
hotwatch = { git = "https://github.com/h3r2tic/hotwatch.git", rev = "7576ad4ab2535f20d3c59d65b334355d4170cb97" }
flate2 = "=1.0.24"
itertools.workspace = true
# 原 B 的 ICC 解析/变换及其完整 Little CMS 2.15 实现。
lcms2 = { version = "=5.6.0", features = ["static"] }
lcms2-sys = "=4.0.1"
log.workspace = true
log-once.workspace = true
nohash-hasher.workspace = true
parking_lot.workspace = true
relative-path.workspace = true
ron.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
slotmap.workspace = true
utils.workspace = true
uuid = { version = "=1.15.1", features = ["v4", "serde"] }
xxhash-rust = { workspace = true, features = ["xxh3"] }
zeno = "=0.2.2"
dolly = "=0.6.0"
egui = "=0.27.2"
enum-iterator = "=1.2.0"
image.workspace = true

[dev-dependencies]
fnv.workspace = true

[lints]
workspace = true
