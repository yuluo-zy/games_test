[package]
name = "prism-gfx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Backend-neutral core of the renderer: errors, queue sync points, accounting, retirement and collections"

[features]
# Backend-native type aliases. With the feature on, the neutral names in `native_types` are the Vulkan
# types themselves (`StageMask` is `ash::vk::PipelineStageFlags`), so code and tests written against `ash`
# keep compiling unchanged. With it off, they are self-contained numeric newtypes with the same values, so
# a backend that is not Vulkan can use this crate without `ash`. Both configurations must compile.
native-types = ["dep:ash"]
# Exposes internal modules to the facade's own integration tests and benches.
test-support = []

[dependencies]
ash = { workspace = true, optional = true }
log.workspace = true
thiserror.workspace = true

[lints]
workspace = true
