[package]
name = "rhapsody"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Render graph, graphics resource rules and shader interfaces"
readme = "README.md"

[features]
default = []
# Public 0.27 is a candidate adapter; the original local 0.26 fork is unidentified.
candidate-suballocation = ["dep:gpu-allocator"]
candidate-optimizations = []

[dependencies]
ash.workspace = true
spirq.workspace = true
ustr.workspace = true
rspirv.workspace = true
shader-pipeline.workspace = true
shader-compiler.workspace = true
serde.workspace = true
serde_json.workspace = true
ron.workspace = true
parking_lot.workspace = true
log.workspace = true
arc-swap = { workspace = true, features = ["weak"] }
append-only-vec.workspace = true
bevy_tasks.workspace = true
gpu-allocator = { version = "=0.27.0", default-features = false, features = ["vulkan"], optional = true }

[lints]
workspace = true
