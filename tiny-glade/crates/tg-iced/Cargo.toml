[package]
name = "tg-iced"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Localized dialog options and native GUI adapter"
readme = "README.md"


[package.metadata.reconstruction]
baseline = "B"
original_features_known = false
original_abi_recovered = false

[dependencies]
lang-lib = { path = "../lang-lib", version = "=0.1.0" }
iced = { version = "=0.12.1", git = "https://github.com/PounceLight/iced.git", rev = "2bccf7317e42422cb3b98c0de4f291d8c0865380", default-features = false, features = ["tokio"], optional = true }

[features]
default = []
native-gui = ["dep:iced"]

[[example]]
name = "tg_iced_native_probe"
required-features = ["native-gui"]

[lints]
workspace = true
