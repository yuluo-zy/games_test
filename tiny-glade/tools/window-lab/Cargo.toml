[package]
name = "rhapsody-window-lab"
version = "0.1.0"
edition = "2024"
publish = false

# Isolated resolver: unrelated workspace crates must not block this acceptance tool.
[workspace]

[[bin]]
name = "rhapsody-window-lab"
path = "../../crates/rhapsody/examples/window_lab.rs"

[dependencies]
rhapsody = { path = "../../crates/rhapsody" }
ash = "=0.38.0"
serde = { version = "=1.0.200", features = ["derive"] }
serde_json = "=1.0.85"
rspirv = "=0.11.0"

[target.'cfg(target_os = "macos")'.dependencies]
winit = { git = "https://github.com/PounceLight/winit.git", rev = "d03de0a0a881be9422c360083151b0e7a8a2582e", default-features = false, features = ["rwh_06"] }
objc = "=0.2.7"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
