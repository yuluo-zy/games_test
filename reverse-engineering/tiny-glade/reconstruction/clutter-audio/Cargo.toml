[workspace]
members = ["crates/tg-clutter-audio"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.86"
publish = false

[workspace.dependencies]
bevy_app = { version = "=0.16.0", default-features = false, features = ["std"] }
bevy_ecs = { version = "=0.16.0", default-features = false, features = ["std"] }
glam = "=0.29.3"
hashbrown = "=0.15.2"
serde = { version = "=1.0.200", features = ["derive"] }
serde_json = "=1.0.85"

[profile.release]
debug = true
