[package]
name = "tg-rhapsody-reconstruction"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
publish = false
description = "Evidence-backed private render graph kernels for the supplied Tiny Glade build"

[dependencies]
ash = "=0.38.0+1.3.281"
tiny-glade-sequence-runtime-r8 = { path = "work-packages/sequence-runtime-r8" }
tiny-glade-queue-submit-r8 = { path = "work-packages/queue-submit-r8" }
tiny-glade-record-resources-r7 = { path = "work-packages/record-resources-r7" }
tiny-glade-registry-pool-candidate = { path = "work-packages/registry-pool" }
tiny-glade-barrier-record-r5 = { path = "work-packages/barrier-record-r5" }

[lib]
path = "lib.rs"

[[bin]]
name = "tg-render-oracle"
path = "../../scripts/render-recovery/runner.rs"

[workspace]
exclude = [
    "work-packages/barrier-record-r5",
    "work-packages/queue-submit-r8",
    "work-packages/record-resources-r7",
    "work-packages/registry-pool",
    "work-packages/sequence-runtime-r8",
    "work-packages/device-counters-r6",
    "work-packages/gpu-lifecycle-r3",
    "work-packages/queue-callers-r7",
    "original-skeleton/crates/rhapsody",
]

