[package]
name = "tiny-glade-reconstruction"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Evidence-backed reconstruction of the supplied Tiny Glade build"
publish = false

[dependencies]
fastrand = "=1.8.0"
glam = "=0.29.3"
half = "=2.4.1"

[features]
default = ["library"]
library = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "tg-reconstruction"
path = "src/main.rs"

[profile.release]
debug = true

[workspace]
members = ["."]
