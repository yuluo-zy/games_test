[package]
name = "crash-reporter-gui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
tg-iced = { path = "../tg-iced", version = "=0.1.0", default-features = false }

tg-integrity-report = { path = "../tg-integrity-report", version = "=0.1.0", default-features = false }

webbrowser = { version = "=0.8.10", optional = true }
open = { version = "=5.0.0", optional = true }
arboard = { version = "=3.6.0", default-features = false, optional = true }

[package.metadata.reconstruction]
baseline = "B"
original_features_known = false
original_abi_recovered = false

[features]
default = ["native-gui"]
native-gui = ["tg-iced/native-gui", "tg-integrity-report/native-gui", "dep:arboard", "dep:webbrowser", "dep:open"]

[[example]]
name = "crash_reporter_gui_native_probe"
required-features = ["native-gui"]
