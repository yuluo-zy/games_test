[package]
name = "tiny-glade-camera-b"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[lib]
path = "mod.rs"
[dependencies]
glam = { version = "=0.29.3", features = ["serde", "mint"] }
dolly = "=0.6.0"
glam_dolly = { package = "glam", version = "=0.27.0", features = ["mint"] }
mint = "=0.5.9"
serde = { version = "=1.0.200", features = ["derive"] }
serde_json = "=1.0.85"
bevy_app = "=0.16.0"
bevy_ecs = "=0.16.0"
[profile.release]
debug = true
