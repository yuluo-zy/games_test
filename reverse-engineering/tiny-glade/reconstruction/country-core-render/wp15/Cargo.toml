[package]
name = "country-core-wp15"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "WP15 reconstruction: country-core UI / input / startup / app-shell domain (version B)"
publish = false

# Standalone crate; keep out of the parent reconstruction workspace.
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
# Versions respect the original release Cargo.lock baseline (same pins the
# assembled `country-core` crate uses — see reconstruction/Cargo.lock).
glam = { version = "=0.29.3", features = ["serde"] }
serde = { version = "=1.0.200", features = ["derive"] }
serde_json = "=1.0.85"
ron = "=0.8.1"
anyhow = "=1.0.103"
parking_lot = "=0.12.1"
log = "=0.4.27"

# bevy_ecs: the game's Bevy family (0.16.0, reused dep). Used for the app-shell
# resource/world helpers (`utils::get_res` etc.) and component surfaces.
bevy_ecs = { version = "=0.16.0", features = ["bevy_reflect"] }

[profile.dev]
opt-level = 0
