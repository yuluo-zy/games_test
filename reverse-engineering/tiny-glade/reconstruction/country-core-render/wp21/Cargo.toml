[package]
name = "country-core-wp21-misc-resources"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "WP21 — Tiny Glade country-core remaining misc resources skeleton-aligned Rust (walls/stairs/ivy/rt residual + misc resources + garden/save residual)"
publish = false

# Standalone offline gate; keep out of the parent reconstruction workspace.
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
# --- versions respect the original release Cargo.lock baseline (indexmap 2.7.1,
#     foldhash 0.1.4, parry3d 0.17.0, perchance 0.4.0; petgraph 0.8.3 cache) ---
glam = { version = "=0.29.3", features = ["serde"] }
serde = { version = "=1.0.200", features = ["derive"] }
serde_json = "=1.0.85"
ron = "=0.8.1"
hashbrown = "=0.14.5"
itertools = "=0.13.0"
fastrand = "=1.8.0"
parking_lot = "=0.12.1"
log = "=0.4.27"
bevy_ecs = { version = "=0.16.0", features = ["bevy_reflect"] }

# Graph containers the game actually uses (petgraph GraphMap / indexmap IndexMap /
# std RandomState = foldhash) — declared and used in stairs_state / structural_graph.
petgraph = "=0.8.3"
indexmap = "=2.7.1"
foldhash = "=0.1.4"

# NOT declared (unavailable / reuse-boundary): steamworks (→ Gap), bracket-noise
# (→ Gap), obvhs (→ Gap), parry3d 0.17.0 (→ Gap in decorator_collision), perchance
# 0.4.0 (→ Gap in ivy_storage), smallvec, puffin, rhapsody, lang-lib.
