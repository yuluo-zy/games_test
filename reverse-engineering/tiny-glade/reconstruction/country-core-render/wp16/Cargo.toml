[package]
name = "country-core-misc-wp16"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "WP16 standalone offline-gate crate: country-core misc resources + systems residual (ivy/rt/window_lights/color_id, backend/collision/debug/paths/steam/ivy systems, non-render asset_libraries, components residual, geometry+utils residual)"
publish = false

# Standalone crate; keep out of the parent reconstruction workspace.
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
# Versions respect the original release Cargo.lock baseline (glam 0.29.3,
# serde 1.0.200, hashbrown 0.14.5, parking_lot 0.12.1, log 0.4.27, anyhow
# 1.0.103); all confirmed present in the offline registry cache.
glam = { version = "=0.29.3", features = ["serde"] }
serde = { version = "=1.0.200", features = ["derive"] }
serde_json = "=1.0.85"
hashbrown = "=0.14.5"
parking_lot = "=0.12.1"
log = "=0.4.27"
anyhow = "=1.0.103"

# bevy_ecs 0.16.0 = the game's Bevy family (0.16.0), confirmed in the offline
# cache. Used for Component / Resource / Entity / World / Query markers.
bevy_ecs = { version = "=0.16.0", features = ["bevy_reflect"] }

# Reused dependencies NOT in the offline registry cache are represented by local
# `reused` contract modules (watch/hotwatch+notify, rapier3d/parry3d, steamworks,
# bracket-noise, perchance, obvhs, tabloid, append-only-vec,
# conservative-line-raster, frozen/nohash-hasher, priority-queue): see
# src/reused.rs. Game-side call surfaces only — no re-implementation.

[profile.dev]
opt-level = 0
