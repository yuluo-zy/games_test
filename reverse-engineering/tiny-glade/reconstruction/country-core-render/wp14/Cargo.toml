[package]
name = "country-core-wp14-audio"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "WP14 evidence-bundle crate for the Tiny Glade country-core audio content domain (B skeleton-aligned; standalone)"
publish = false

# Standalone skeleton crate; keep out of the parent reconstruction workspace.
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
# Versions respect the original release Cargo.lock baseline (see reconstruction/Cargo.lock).
bevy_ecs = { version = "=0.16.0", features = ["bevy_reflect"] }
glam = { version = "=0.29.3" }
serde = { version = "=1.0.200", features = ["derive"] }
serde_json = "=1.0.85"
hashbrown = "=0.14.5"
log = "=0.4.27"
anyhow = "=1.0.103"
slotmap = "=1.0.6"
fastrand = "=1.8.0"

# NOT declared (reused dependencies / unavailable offline): fmod(libfmod), puffin,
# ron, bevy_app — referenced as typed-gap boundaries only.
