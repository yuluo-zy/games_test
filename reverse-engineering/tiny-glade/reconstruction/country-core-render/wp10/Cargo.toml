[package]
name = "country-core-render-wp10"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "WP10 — Tiny Glade country-core vegetation + critters CPU content domain (B skeleton-aligned)"
publish = false

# Standalone skeleton crate; keep out of the parent reconstruction workspace.
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
# Versions respect the original release Cargo.lock baseline (reconstruction/Cargo.lock).
glam = { version = "=0.29.3", features = ["serde"] }
serde = { version = "=1.0.200", features = ["derive"] }
serde_json = "=1.0.85"
hashbrown = "=0.14.5"
log = "=0.4.27"
perchance = "=0.4.0"

# bevy_ecs 0.16.0 = the game's Bevy family (as confirmed for country-core).
bevy_ecs = { version = "=0.16.0", features = ["bevy_reflect"] }

# NOT declared (reused dependencies / unavailable offline): fmod(libfmod), rhapsody,
# puffin, frozen, nohash-hasher, ron, itertools — referenced as typed-gap boundaries.
