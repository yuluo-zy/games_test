[package]
name = "tg-package-integrity"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
blake3 = "=1.5.3"
fnv = "=1.0.7"
relative-path = "=1.9.0"
easy-parallel = "=3.2.0"
serde = { version = "=1.0.200", features = ["derive"] }
serde_json = "=1.0.85"

[lib]
path = "D:/game/tiny-glade/crates/tg-package-integrity/src/lib.rs"

[workspace]
resolver = "2"

[[bin]]
name = "fixture-driver"
path = "../fixture_driver.rs"

[[example]]
name = "inspect_package"
path = "D:/game/tiny-glade/crates/tg-package-integrity/examples/inspect_package.rs"
