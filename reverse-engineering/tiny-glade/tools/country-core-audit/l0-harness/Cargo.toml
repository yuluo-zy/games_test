[package]
name = "l0-harness"
version = "0.0.0"
edition = "2021"
publish = false
description = "隔离编译并测试 country-core 渲染层（A1–A3）单元：离线，不需要 rhapsody/网络。源文件里的 @SRC@ 由 run.sh 替换。"

[dependencies]
glam = { version = "=0.29.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

parking_lot = { path = "parking_lot_shim" }
log = "=0.4.27"
anyhow = "=1.0.103"
xxhash-rust = { version = "=0.8.17", features = ["xxh3"] }
bevy_ecs = { version = "=0.16.0", default-features = false }
serde_json = "=1.0.85"
hashbrown = "=0.14.5"
itertools = "=0.14.0"
slotmap = { path = "slotmap_shim" }
fnv = "=1.0.7"
half = { path = "half_shim" }

[workspace]
