<style>

#canvas{position:relative;padding:8px 0 24px;min-height:350px}#edges{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:0}.lane{position:relative;display:grid;grid-template-columns:105px minmax(0,1fr);gap:10px;padding:23px 21px 27px;align-items:center;border-bottom:1px solid var(--border);min-height:111px}.lane:last-child{border:0}.lane-label{z-index:2;background:var(--paper);align-self:start;position:sticky;top:10px}.lane-label .level{font:12px/1.5 Consolas,monospace;color:var(--muted)}.lane-label h2{font-size:14px;font-weight:600;margin:2px 0}.lane-label small{font-size:11px;color:var(--muted)}.nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:18px 14px;position:relative;z-index:1}.lane.key .nodes{display:flex;justify-content:center;flex-wrap:wrap}.lane.key .node{width:268px}.node{position:relative;border:1px solid var(--border);border-radius:8px;padding:11px 13px;text-align:left;background:var(--paper);min-height:83px;box-shadow:0 2px 5px #24384a04;transition:opacity .15s,border-color .15s,box-shadow .15s;min-width:0}.node:hover{border-color:var(--blue);box-shadow:0 4px 14px #2b66cc15}.node .name{font:600 12.5px/1.5 Consolas,"Microsoft YaHei",monospace;overflow-wrap:anywhere;display:block}.node .role{display:block;color:var(--muted);font-size:12px;margin:3px 0 5px;overflow-wrap:anywhere}.node .bottom{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px;align-items:center}.status{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.status:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--muted)}.status.partial:before{background:var(--green)}.status.candidate:before{background:var(--orange)}.status.missing:before{background:#c35454}.node.reuse{border-style:dashed}.node.selected{border:2px solid var(--blue);padding:10px 12px;background:var(--soft)}.node.selected .name{color:var(--blue)}.node.upstream{border-color:var(--purple)}.node.downstream{border-color:var(--blue)}.node.dim{opacity:.27}.node.hit{box-shadow:0 0 0 3px var(--soft)}
aside{position:sticky;top:18px;max-height:calc(100vh - 40px);overflow:auto;scrollbar-width:thin;background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:21px}.aside-label{font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}aside h2{font:600 21px/1.3 Consolas,"Microsoft YaHei",monospace;margin:9px 0;overflow-wrap:anywhere}.aside-role{color:var(--muted);margin:0 0 12px}.pill{display:inline-block;font-size:11px;padding:3px 8px;background:var(--bg);border:1px solid var(--border);border-radius:20px;margin:0 4px 5px 0}.detail-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:17px 0;padding:13px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.detail-stats strong{font-size:24px;font-weight:500;display:block}.detail-stats span{font-size:12px;color:var(--muted)}aside h3{font-size:13px;font-weight:600;margin:20px 0 7px}.package-list{display:flex;flex-wrap:wrap;gap:5px}.package-list button{font:12px/1.4 Consolas,monospace;border:1px solid var(--border);padding:5px 7px;border-radius:5px;background:var(--paper);overflow-wrap:anywhere;text-align:left}.package-list button:hover{color:var(--blue);background:var(--soft)}.focus-button{width:100%;padding:9px;background:var(--soft);border:1px solid #c7d8f4;border-radius:7px;margin:6px 0;color:var(--blue)}.module{padding:10px 0;border-top:1px solid var(--border)}.module a{font:12px/1.5 Consolas,monospace;overflow-wrap:anywhere}.module p{font-size:12px;color:var(--muted);margin:4px 0}.module ul{font-size:12px;margin:7px 0 0;padding-left:17px;color:var(--muted)}.source{font:11px/1.5 Consolas,monospace;overflow-wrap:anywhere;color:var(--muted)}.intro-chain{margin:20px 0;color:var(--blue);font:14px/1.9 Consolas,monospace}.intro-chain span{display:block}.intro-chain .arrow{color:var(--muted);padding-left:25px}.intro-note{font-size:13px;color:var(--muted)}.badge-row{margin-top:11px}.note{padding:14px 20px;background:var(--bg);font-size:12px;color:var(--muted);border-top:1px solid var(--border)}footer{max-width:1800px;margin:0 auto;padding:0 26px 26px;color:var(--muted);font-size:12px}footer details{margin:8px 0}footer summary{cursor:pointer}footer li{margin:5px 0}.empty{padding:40px;color:var(--muted)}

@media(max-width:800px){main{grid-template-columns:1fr}aside{position:static;max-height:none;overflow:visible}.head-line{align-items:start;flex-direction:column;gap:8px}header{padding:20px}.lane{grid-template-columns:75px minmax(0,1fr)}.nodes{grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}.controls{gap:8px}.search{max-width:none}.node.dim{opacity:.4}}
@media(max-width:430px){main{padding:10px}.lane{display:block;padding:18px 13px}.lane-label{position:static;display:flex;gap:9px;align-items:center;margin-bottom:13px}.lane-label h2{margin:0}.nodes{grid-template-columns:1fr 1fr;gap:10px}.node{padding:9px;min-height:95px}.node .name{font-size:11px}.node .bottom{display:block}.lane.key .node{width:100%}.node.selected{padding:8px}.graph-meta{padding:12px}.legend{gap:10px}.seg button{padding:7px}.search{min-width:100%;order:6}}
.compact .lane{grid-template-columns:90px minmax(0,1fr);padding:15px 16px;gap:8px;min-height:84px}.compact .lane-label small{display:none}.compact .nodes{grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:12px}.compact .node{min-height:54px;padding:8px 10px}.compact .node.selected{padding:7px 9px}.compact .node .role{display:none}.compact .node .name{font-size:12px}.compact .node .bottom{margin-top:3px}.compact .lane.key .node{width:240px}@media(max-width:430px){.compact .lane{display:block}.compact .nodes{grid-template-columns:1fr 1fr}.compact .node .name{font-size:11px}.compact .lane.key .node{width:100%}}
.node.recovery-in_progress{background:#fff7eb;box-shadow:inset 0 3px 0 #dc941f}.node.recovery-complete{background:#e5f4ec;box-shadow:inset 0 3px 0 var(--green)}.node.recovery-in_progress:not(.selected):not(.upstream):not(.downstream){border-color:#e7c58d}.node.recovery-complete:not(.selected):not(.upstream):not(.downstream){border-color:#8dc7ab}.node.recovery-in_progress .status:before{background:#dc941f}.node.recovery-complete .status:before{background:var(--green)}
.stage-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;margin:9px 0 0}.stage-cell{min-width:0;text-align:center}.stage-bar{display:block;height:7px;border-radius:2px;background:#dce3ec}.stage-bar.in_progress{background:repeating-linear-gradient(135deg,#dc941f 0,#dc941f 4px,#f5cd86 4px,#f5cd86 8px)}.stage-bar.complete{background:var(--green)}.stage-cell small{display:block;font-size:9px;color:var(--muted);line-height:1.6;margin-top:3px;white-space:nowrap}.compact .stage-strip{margin-top:7px}.compact .stage-cell small{font-size:9px}.stage-reuse{display:block;color:var(--muted);font-size:10px;margin-top:7px}.stage-status{font-weight:600}.stage-status.in_progress{color:#a5650b}.stage-status.complete{color:var(--green)}
.progress-overview{padding:15px 20px;border-bottom:1px solid var(--border);background:#fafbfd}.progress-counters{display:flex;gap:18px;flex-wrap:wrap;font-size:12px}.progress-counters strong{font-size:21px;font-weight:650;margin-right:4px}.progress-counters .active{color:#a5650b}.progress-counters .done{color:var(--green)}.progress-key{display:flex;gap:13px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted);margin:9px 0}.progress-key i{display:inline-block;width:18px;height:7px;border-radius:2px;margin-right:5px;vertical-align:middle}.progress-caption{font-size:11px;color:var(--muted);margin:0}.stage-detail{list-style:none;padding:0;margin:12px 0}.stage-detail li{padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}.stage-detail .stage-bar{display:inline-block;width:22px;margin-right:7px;vertical-align:middle}.stage-detail strong{font-weight:600}.stage-detail small{display:block;margin:4px 0 0 29px;color:var(--muted)}.missing-note{color:#9d4848;font-size:12px;background:#fff0ee;padding:8px;border-radius:5px}.module details{font-size:11px;color:var(--muted)}.module details a{display:block;margin:5px 0}.progress-counters span{white-space:nowrap}
@media(max-width:430px){.progress-overview{padding:12px}.progress-counters{gap:10px}.progress-counters strong{font-size:18px}.stage-cell small,.compact .stage-cell small{font-size:8px}}
</style>

<body class="compact">
<header><div class="head-line"><div><div class="eyebrow">TINY GLADE / RECOVERY PROGRESS</div><h1>包引用与恢复进度</h1><p class="sub">橙色节点已开始恢复。五段进度依次显示分析、实现、接线、原作对照与完整验收；完成阶段整段变为绿色。</p></div><a class="head-link" href="MODULE_PROGRESS.md">打开源码模块进度表 ↗</a></div></header>
<section class="controls" aria-label="图表控制">
 <div class="seg" id="layout-switch"><button data-layout="architecture" aria-pressed="true">职责分层</button><button data-layout="depth" aria-pressed="false">依赖深度</button></div>
 <label class="field">范围 <select id="scope"><option value="core">主要游戏包</option><option value="local">全部 52 个 local 包</option></select></label>
 <label class="field"><input id="external" type="checkbox" checked> 常用外部库</label>
 <label class="field"><input id="all-edges" type="checkbox"> 全部直接连线</label>
 <label class="field"><input id="compact" type="checkbox" checked> 紧凑总览</label>
 <div class="search"><input id="search" type="search" placeholder="搜索全部 901 个包…" aria-label="搜索包" autocomplete="off"><div id="results" class="results" hidden></div></div>
 <button class="reset" id="reset">总览</button>
</section>
<main>
 <section class="diagram" aria-label="包依赖图"><div class="progress-overview"><div id="progress-summary" class="progress-counters" aria-live="polite"></div><div class="progress-key"><span><i class="stage-bar in_progress"></i>恢复中 / 阶段部分完成</span><span><i class="stage-bar complete"></i>阶段已完成</span><span><i class="stage-bar pending"></i>未登记开始</span><span>虚线节点：依赖复用</span></div><p id="progress-caption" class="progress-caption"></p></div><div class="graph-meta"><strong id="count">正在载入…</strong><div class="legend"><span><i class="swatch"></i>它依赖谁</span><span><i class="swatch up"></i>谁引用它</span><span><i class="swatch gray"></i>其他引用</span></div></div><div id="canvas"><svg id="edges" aria-hidden="true"></svg><div id="lanes"></div></div><div id="graph-note" class="note"></div></section>
 <aside id="detail" aria-label="选中包的详细关系" aria-live="polite"></aside>
</main>
<footer><div id="provenance"></div><details><summary>来源、分层与未解析边界</summary><ul id="limits"></ul><div id="unresolved"></div><p>刷新：<code>py -3 scripts/build-package-graph.py</code>。模块状态来自 <a href="MODULE_PROGRESS.md">MODULE_PROGRESS.md</a>；包边来自 B 原作锁文件，不来自重建工程的 Cargo.toml。</p></details></footer>
<script id="package-data" type="application/json">__PACKAGE_DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('package-data').textContent);
const NODES=new Map(DATA.nodes.map(n=>[n.id,n]));
const OUT=new Map(DATA.nodes.map(n=>[n.id,[]])),IN=new Map(DATA.nodes.map(n=>[n.id,[]]));
for(const e of DATA.edges){OUT.get(e.from).push(e.to);IN.get(e.to).push(e.from)}
const $=id=>document.getElementById(id),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LAYERS=[['入口','应用与插件组装'],['游戏系统','工具 / 内容 / 协调'],['共享核心','状态 / 资源 / 系统'],['渲染与Shader','图执行 / 文本 / 编译'],['共享基础','数据 / 工具 / 平台'],['外部依赖','复用原版本与来源']];
const STAGE_LABELS={pending:'未登记开始',in_progress:'部分完成',complete:'已完成'};
function stageStrip(n){if(n.progress.state==='excluded')return '<span class="stage-reuse">复用原依赖 · 不计逆向进度</span>';return `<span class="stage-strip" aria-label="${esc(n.progress.stages.map(s=>s.label+'：'+STAGE_LABELS[s.state]).join('；'))}">${n.progress.stages.map(s=>`<span class="stage-cell" title="${esc(s.label+'：'+STAGE_LABELS[s.state])}"><span class="stage-bar ${s.state}"></span><small>${esc(s.label.replace('原作对照','对照').replace('完整验收','验收'))}</small></span>`).join('')}</span>`}
function progressDetail(n){if(n.progress.state==='excluded')return '<h3>恢复进度</h3><p class="intro-note">复用原版本与来源，必要的本地分叉差异另行核实。</p>';const notes={analysis:'按原作业务规则与类型合同分析；部分分析不代表全部分支已解释。',implementation:'已有本机恢复代码；草稿与候选实现不代表完整模块实现。',integration:'已有登记的生产者与消费者接线；完整游戏链仍需单独验收。',verification:'已有登记的局部原作对照；编译与候选测试不代替原作完整行为验证。',acceptance:'全部已登记 B 模块的完整版本、范围与报告明确验收后完成。'};return `<h3>阶段进度 · ${esc(n.progress.label)}</h3><ol class="stage-detail">${n.progress.stages.map(s=>`<li><span class="stage-bar ${s.state}"></span><strong>${esc(s.label)}</strong> <span class="stage-status ${s.state}">${STAGE_LABELS[s.state]}</span><small>${esc(s.state==='complete'?'此阶段已明确登记完成。':s.state==='pending'?'尚无此阶段的有效推进记录。':notes[s.key])}</small></li>`).join('')}</ol><p class="intro-note">按 ${n.progress.registeredModules} 个已登记 B 源码模块汇总；五段表示阶段状态，不换算功能完成百分比。</p>${n.progress.missingModules?`<p class="missing-note">${n.progress.missingModules} 个模块有历史交付记录，但本机源码缺失；未据此计入实现完成。</p>`:''}`}
function progressSummary(){const nodes=[...visibleIds].map(id=>NODES.get(id)),count=state=>nodes.filter(n=>n.progress.state===state).length;$('progress-summary').innerHTML=`<span class="active"><strong>${count('in_progress')}</strong>恢复中</span><span class="done"><strong>${count('complete')}</strong>完整验收</span><span><strong>${count('pending')}</strong>未登记开始</span><span><strong>${count('excluded')}</strong>依赖复用</span>`;$('progress-caption').textContent=`当前显示范围 · 台账更新 ${DATA.progressUpdatedAt.slice(0,19).replace('T',' ')} · 阶段完成用绿色实心填满；进行中用橙色斜纹。`}
let selected=null,layout='architecture',focus=false,visibleIds=new Set(),shownEdges=[],drawScheduled=false;
function reaches(start,target,allowed,skip){let q=[start],seen=new Set([start]);while(q.length){let x=q.pop();for(const y of OUT.get(x)){if(!allowed.has(y)||(skip&&x===skip.from&&y===skip.to))continue;if(y===target)return true;if(!seen.has(y)){seen.add(y);q.push(y)}}}return false}
function visible(){if(focus&&selected)return new Set([selected,...OUT.get(selected),...IN.get(selected)]);let ids=new Set(DATA.nodes.filter(n=>($('scope').value==='local'?n.local:n.core)||($('external').checked&&n.external)).map(n=>n.id));if(selected)ids.add(selected);return ids}
function depthRanks(ids){let incoming=new Map([...ids].map(id=>[id,0])),rank=new Map([...ids].map(id=>[id,0]));for(const e of DATA.edges)if(ids.has(e.from)&&ids.has(e.to))incoming.set(e.to,incoming.get(e.to)+1);let queue=[...ids].filter(id=>incoming.get(id)===0),processed=0;while(queue.length){let x=queue.shift();processed++;for(const y of OUT.get(x)){if(!ids.has(y))continue;rank.set(y,Math.max(rank.get(y),rank.get(x)+1));incoming.set(y,incoming.get(y)-1);if(incoming.get(y)===0)queue.push(y)}}if(processed!==ids.size)throw new Error('显示子图存在环，不能伪造依赖深度');return rank}
function render(){visibleIds=visible();let direct=DATA.edges.filter(e=>visibleIds.has(e.from)&&visibleIds.has(e.to));shownEdges=$('all-edges').checked||focus?direct:direct.filter(e=>!reaches(e.from,e.to,visibleIds,e));const rank=layout==='depth'?depthRanks(visibleIds):new Map([...visibleIds].map(id=>[id,NODES.get(id).layer]));const groups=new Map;for(const id of visibleIds){let r=rank.get(id);if(!groups.has(r))groups.set(r,[]);groups.get(r).push(NODES.get(id))}
let html='';for(const [r,nodes]of [...groups].sort((a,b)=>a[0]-b[0])){nodes.sort((a,b)=>a.name.localeCompare(b.name)||a.version.localeCompare(b.version));let title=layout==='depth'?'引用层 '+r:LAYERS[r][0],sub=layout==='depth'?'显示子图最长引用深度':LAYERS[r][1];html+=`<section class="lane ${nodes.length===1?'key':''}" data-rank="${r}"><div class="lane-label"><span class="level">L${r}</span><h2>${title}</h2><small>${sub}</small></div><div class="nodes">`;for(const n of nodes){html+=`<button class="node ${n.status==='reuse'?'reuse':''} recovery-${n.progress.state}" data-id="${esc(n.id)}" aria-label="${esc(n.name+' '+n.version+'，'+n.role+'，'+n.progress.label+'，'+n.statusLabel)}" aria-pressed="false"><span class="name">${esc(n.name)}</span><span class="role">${esc(n.role)}</span><span class="bottom"><span class="status ${n.status}">${esc(n.progress.state==='excluded'?n.statusLabel:n.progress.label)}</span><span>${esc(n.version.replace('+1.3.281',''))}</span></span>${stageStrip(n)}</button>`}html+='</div></section>'}$('lanes').innerHTML=html;progressSummary();
$('count').textContent=`B 原作 · ${visibleIds.size} 个显示包 / ${shownEdges.length} 条基础连线`;
$('graph-note').textContent=(focus?'当前为选中包的全部直接上下游；这不是完整运行调用链。':layout==='depth'?'层数由当前显示子图的依赖计算：使用者始终高于依赖包。':'职责分层是便于阅读的架构布局，同层包也可以互相引用。')+(!$('all-edges').checked&&!focus?' 主干模式只隐藏已有可达路径的重复直接边；选中包时补画它的全部显示范围内直接引用。':' 所有显示范围内的直接依赖均已画出。');
document.querySelectorAll('.node').forEach(b=>b.addEventListener('click',()=>select(b.dataset.id)));highlight();renderDetail();scheduleDraw()}
function select(id){if(!NODES.has(id))return;selected=id;$('results').hidden=true;$('search').value='';if(!visibleIds.has(id)||focus)render();else{highlight();renderDetail();scheduleDraw()}}
function highlight(){let deps=selected?new Set(OUT.get(selected)):new Set,consumers=selected?new Set(IN.get(selected)):new Set;for(const button of document.querySelectorAll('.node')){let id=button.dataset.id;button.classList.toggle('selected',id===selected);button.classList.toggle('downstream',id!==selected&&deps.has(id));button.classList.toggle('upstream',id!==selected&&consumers.has(id));button.classList.toggle('dim',!!selected&&id!==selected&&!deps.has(id)&&!consumers.has(id));button.setAttribute('aria-pressed',String(id===selected))}}
function packageButtons(ids){if(!ids.length)return '<span class="intro-note">没有已解析的直接引用</span>';return [...ids].sort((a,b)=>NODES.get(a).name.localeCompare(NODES.get(b).name)).map(id=>`<button data-jump="${esc(id)}">${esc(NODES.get(id).name)} <small>${esc(NODES.get(id).version)}</small></button>`).join('')}
function renderRelationships(){if(!selected){$('detail').innerHTML=`<div class="aside-label">恢复进度</div><h2>沿着五个阶段看进度</h2><p class="intro-note">橙色背景的节点已开始恢复。节点下方五段从左到右：分析 → 实现 → 接线 → 原作对照 → 完整验收。</p><p class="intro-note">橙色斜纹表示阶段部分完成；明确验收后整段变为绿色实心。整包完整验收后，整个节点变为绿色。</p><p class="intro-note">当前台账尚无整包完整验收记录。局部函数通过对照，仍保留为该阶段的部分完成。</p><div class="intro-chain"><span>tiny-glade</span><span class="arrow">↓ 游戏系统</span><span>country-core</span><span class="arrow">↓ 自有图执行</span><span>rhapsody</span><span class="arrow">↓ Vulkan API</span><span>ash / Vulkan</span></div><p class="intro-note">点击包可查看阶段状态、已恢复范围与证据。蓝色连线显示它依赖谁，紫色显示谁引用它。</p><p class="intro-note">灰色表示未登记开始；虚线包复用原依赖。“依赖深度”按实际引用排列，“职责分层”用于整体阅读。</p>`;return}
const n=NODES.get(selected),out=OUT.get(selected),inc=IN.get(selected);$('detail').innerHTML=`<div class="aside-label">直接引用 · ${focus?'聚焦':'总览'}</div><h2>${esc(n.name)}</h2><p class="aside-role">${esc(n.role)}</p><div class="badge-row"><span class="pill">${esc(n.version)}</span><span class="pill">${n.local?'local/path':'外部来源'}</span><span class="pill">${esc(n.statusLabel)}</span>${!n.inRoot?'<span class="pill">未进主包构建闭包</span>':''}</div><div class="detail-stats"><div><strong>${inc.length}</strong><span>直接引用它的包</span></div><div><strong>${out.length}</strong><span>它直接依赖的包</span></div></div><button class="focus-button" id="focus-button">${focus?'返回整体，保留选中包':'聚焦全部直接上下游'}</button><h3 style="color:var(--purple)">谁引用它 ↑</h3><div class="package-list">${packageButtons(inc)}</div><h3 style="color:var(--blue)">它依赖谁 ↓</h3><div class="package-list">${packageButtons(out)}</div><h3>源码模块与恢复范围</h3>${n.modules.length?n.modules.map(m=>`<section class="module"><a href="${esc(m.detail)}">${esc(m.path)} ↗</a><p>${esc(m.scope)}</p><ul>${m.gaps.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></section>`).join(''):'<p class="intro-note">未登记对应游戏私有源码模块；先核实定义归属。外部依赖直接复用。</p>'}<h3>锁定来源</h3><p class="source">${esc(n.source)}</p><p class="intro-note">${esc(n.policy)}</p>`;$('focus-button').addEventListener('click',()=>{focus=!focus;render()});$('detail').querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.jump)))}
function renderDetail(){renderRelationships();if(!selected)return;const n=NODES.get(selected);$('detail').querySelector('.badge-row').insertAdjacentHTML('afterend',progressDetail(n));$('detail').querySelectorAll('.module').forEach((section,i)=>{const m=n.modules[i];section.insertAdjacentHTML('beforeend',`<p><strong>接线：</strong>${esc(m.integration)}</p><p><strong>验证：</strong>${esc(m.verification)}</p>${m.evidence.length?`<details><summary>查看 ${m.evidence.length} 项范围证据</summary>${m.evidence.map(path=>`<a href="${esc(path)}">${esc(path)} ↗</a>`).join('')}</details>`:''}`)})}
function scheduleDraw(){if(drawScheduled)return;drawScheduled=true;requestAnimationFrame(()=>{drawScheduled=false;draw()})}
function draw(){const root=$('canvas').getBoundingClientRect(),svg=$('edges'),positions=new Map;for(const b of document.querySelectorAll('.node')){const r=b.getBoundingClientRect();positions.set(b.dataset.id,{x:r.left-root.left+r.width/2,y:r.top-root.top,w:r.width,h:r.height,rank:b.closest('.lane').dataset.rank})}svg.setAttribute('width',root.width);svg.setAttribute('height',root.height);svg.setAttribute('viewBox',`0 0 ${root.width} ${root.height}`);const all=DATA.edges.filter(e=>visibleIds.has(e.from)&&visibleIds.has(e.to));let display=[...shownEdges];if(selected){const seen=new Set(display.map(e=>e.from+'→'+e.to));for(const e of all)if((e.from===selected||e.to===selected)&&!seen.has(e.from+'→'+e.to))display.push(e)}let defs='<defs>';for(const [name,color]of [['normal','var(--line)'],['down','var(--blue)'],['up','var(--purple)']])defs+=`<marker id="arrow-${name}" viewBox="0 0 8 8" refX="7.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="${color}"/></marker>`;defs+='</defs>';let output=defs;display.sort((a,b)=>Number(a.from===selected||a.to===selected)-Number(b.from===selected||b.to===selected));for(const e of display){const a=positions.get(e.from),b=positions.get(e.to);if(!a||!b)continue;let dir=e.from===selected?'down':e.to===selected?'up':'normal',color=dir==='down'?'var(--blue)':dir==='up'?'var(--purple)':'var(--line)',opacity=selected?(dir==='normal'?.075:.88):.45;let path;if(a.rank===b.rank){const side=b.x>=a.x?1:-1;const sx=a.x+side*a.w/2,ex=b.x-side*b.w/2;const sy=a.y+a.h*.5,ey=b.y+b.h*.5;const bend=Math.max(24,Math.abs(ex-sx)*.22);path=`M${sx},${sy} C${sx+side*bend},${sy-38} ${ex-side*bend},${ey-38} ${ex},${ey}`}else{const down=b.y>a.y,sx=a.x,sy=down?a.y+a.h:a.y,ex=b.x,ey=down?b.y:b.y+b.h;const bend=Math.max(25,Math.abs(ey-sy)*.43);path=`M${sx},${sy} C${sx},${sy+(down?bend:-bend)} ${ex},${ey+(down?-bend:bend)} ${ex},${ey}`}output+=`<path d="${path}" fill="none" stroke="${color}" stroke-width="${dir==='normal'?1:1.65}" opacity="${opacity}" marker-end="url(#arrow-${dir})"/>`}svg.innerHTML=output}
$('scope').addEventListener('change',()=>{focus=false;render()});$('external').addEventListener('change',render);$('all-edges').addEventListener('change',render);$('compact').addEventListener('change',()=>{document.body.classList.toggle('compact',$('compact').checked);scheduleDraw()});$('reset').addEventListener('click',()=>{selected=null;focus=false;$('search').value='';$('results').hidden=true;render()});document.querySelectorAll('[data-layout]').forEach(b=>b.addEventListener('click',()=>{layout=b.dataset.layout;document.querySelectorAll('[data-layout]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));
$('search').addEventListener('input',()=>{let q=$('search').value.trim().toLowerCase();$('results').hidden=!q;if(!q)return;const matches=DATA.nodes.filter(n=>n.name.toLowerCase().includes(q)).sort((a,b)=>Number(b.local)-Number(a.local)||a.name.localeCompare(b.name)).slice(0,25);$('results').innerHTML=matches.length?matches.map(n=>`<button data-match="${esc(n.id)}">${esc(n.name)} <small>${esc(n.version+' · '+n.role)}</small></button>`).join(''):'<div class="empty">没有匹配包</div>';$('results').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>select(b.dataset.match)))});$('search').addEventListener('keydown',e=>{if(e.key==='Escape')$('results').hidden=true;if(e.key==='Enter'){let first=$('results').querySelector('button');if(first)select(first.dataset.match)}});document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('results').hidden=true});
$('provenance').textContent=`B 原作 Cargo.lock · ${DATA.nodes.length} 个包 · ${DATA.edges.length} 条已解析直接边 · ${DATA.unresolved.length} 条未唯一解析边 · 更新 ${DATA.date.slice(0,10)}`;
$('limits').innerHTML=DATA.limits.map(x=>`<li>${esc(x)}</li>`).join('');$('unresolved').innerHTML='<p>未唯一解析边（图中不猜测连线）：</p>'+DATA.unresolved.map(e=>`<p class="source">${esc(e.parent)} → ${esc(e.dependency)}（${e.candidates} 个候选）</p>`).join('')+`<p class="source">Cargo.lock SHA256：${DATA.lockHash}</p>`;
new ResizeObserver(scheduleDraw).observe($('canvas'));window.addEventListener('resize',scheduleDraw);render();
window.__packageGraph={data:DATA,getState:()=>({selected,layout,focus,visible:[...visibleIds],edges:shownEdges})};
</script>
